spring.application.name=purchases

server.port=40000

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/teraha
spring.datasource.username=postgres.bboesrmuocbuqaqoaswr
spring.datasource.password=${DB_PASSWORD}

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

spring.jpa.open-in-view=false

purchases.paging.page-size=10

products.service.url=http://products

logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=${LOGFILE}
#Cache logging
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.cache=TRACE

spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_LOCATION}
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=

#Redis server
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

#TTLs for entities
app.cache.ttl.default-seconds=${CACHE_TTL_DEFAULT_SECONDS:600}
app.cache.ttl.suppliers-seconds=${SUPPLIERS_CACHE_TTL_SECONDS:300}
app.cache.ttl.purchase-invoices-seconds=${PURCHASE_INVOICES_CACHE_TTL_SECONDS:300}
